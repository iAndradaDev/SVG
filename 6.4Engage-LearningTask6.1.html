
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learning Task 6.1 - Mountain Text Art</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #e9edf2;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        svg {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<h2>Learning Task 6.1 - SVG Text Art</h2>

<svg width="900" height="780"
     viewBox="0 0 900 780"
     xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#152238"/>
            <stop offset="60%" stop-color="#415a77"/>
            <stop offset="100%" stop-color="#e09f7d"/>
        </linearGradient>

        <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff3b0"/>
            <stop offset="100%" stop-color="#ff9f68"/>
        </linearGradient>

        <path id="mountainLeft"
              d="M 85 535 L 325 255 L 495 465"/>

        <path id="mountainRight"
              d="M 390 485 L 600 310 L 825 535"/>

        <path id="mountainBase"
              d="M 135 565 Q 450 610 765 565"/>

        <path id="sunCurve"
              d="M 370 225 Q 450 145 530 225"/>
    </defs>

    <rect width="900" height="780" fill="url(#sky)"/>

    <circle cx="450" cy="260" r="105"
            fill="url(#sun)" opacity="0.95"/>

    <text fill="#ffffff"
          font-size="22"
          font-weight="bold"
          letter-spacing="2">
        <textPath href="#mountainLeft"
                  textLength="530"
                  lengthAdjust="spacing">
            KEEP CLIMBING • NEVER GIVE UP • STAY STRONG
        </textPath>
    </text>

    <text fill="#ffe6a7"
          font-size="21"
          font-weight="bold"
          letter-spacing="1">
        <textPath href="#mountainRight"
                  textLength="480"
                  lengthAdjust="spacing">
            BELIEVE • GROW • REACH HIGHER
        </textPath>
    </text>

    <text fill="#ffffff"
          font-size="17"
          font-weight="bold">
        <textPath href="#sunCurve"
                  textLength="160"
                  lengthAdjust="spacing">
            RISE ABOVE
        </textPath>
    </text>

    <text x="450" y="275"
          text-anchor="middle"
          fill="#152238"
          font-size="30"
          font-weight="bold">
        KEEP GOING
    </text>

    <polygon points="85,545 325,270 495,475 600,320 825,545"
             fill="#243b53"
             opacity="0.45"/>

    <polygon points="85,545 325,270 495,475"
             fill="#20354d"
             opacity="0.65"/>

    <polygon points="390,495 600,320 825,545"
             fill="#172b43"
             opacity="0.65"/>

    <text fill="#ffe6a7"
          font-size="19"
          font-weight="bold"
          letter-spacing="2">
        <textPath href="#mountainBase"
                  textLength="630"
                  lengthAdjust="spacing">
            EVERY STEP FORWARD BRINGS YOU CLOSER TO YOUR DREAMS
        </textPath>
    </text>

    <text x="450" y="650"
          text-anchor="middle"
          fill="#ffffff"
          font-size="30"
          font-weight="bold">
        THE BEST VIEW COMES
    </text>

    <text x="450" y="690"
          text-anchor="middle"
          fill="#ffe6a7"
          font-size="30"
          font-weight="bold">
        AFTER THE HARDEST CLIMB
    </text>

    <text x="450" y="735"
          text-anchor="middle"
          fill="#ffffff"
          font-size="17"
          letter-spacing="3">
        TRUST YOUR JOURNEY
    </text>

</svg>

</body>
</html>
